{% extends "base.html" %}

{% block content %}
<style>
.auth-wrapper {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at top, #1e1b4b, transparent 60%),
        linear-gradient(135deg, #020617, #020617);
}

.auth-card {
    width: 420px;
    padding: 40px;
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(16px);
    border-radius: 20px;
    box-shadow: 0 0 60px rgba(99,102,241,.35);
    color: white;
    text-align: center;
}

.auth-card h1 {
    font-size: 26px;
    margin-bottom: 12px;
}

.auth-card p {
    opacity: .75;
}
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <h1>Email sent ✉️</h1>
        <p>
            If an account with that email exists,
            you’ll receive a password reset link shortly.
        </p>
    </div>
</div>
{% endblock %}
