{% extends "base.html" %}

{% block content %}
<style>
.auth-wrapper {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at top, #1e1b4b, transparent 60%),
        linear-gradient(135deg, #020617, #020617);
}

.auth-card {
    width: 420px;
    padding: 40px;
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(16px);
    border-radius: 20px;
    box-shadow: 0 0 60px rgba(99,102,241,.35);
    color: white;
}

.auth-card h1 {
    font-size: 26px;
    margin-bottom: 12px;
}

.auth-card input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #1e293b;
    background: #020617;
    color: white;
    margin-bottom: 14px;
}

.auth-card input:focus {
    outline: none;
    border-color: #6366f1;
}

.auth-card button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    font-weight: 600;
    cursor: pointer;
}
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <h1>Set new password 🔑</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.password1 }}
            {{ form.password2 }}
            <button type="submit">Update password</button>
        </form>
    </div>
</div>
{% endblock %}
