{% extends "base.html" %}
{% load static %}
{% block title %}Chat{% endblock %}

{% block content %}
<div class="chat-wrapper" style="display:flex; flex-direction:column; height:80vh; background:#020617; color:white;">

    <div class="chat-header" style="display:flex; align-items:center; gap:10px; padding:12px; border-bottom:1px solid #1e293b;">
        <a href="{% url 'chat_list' %}" style="color:white; text-decoration:none; font-size:20px;">←</a>
        <strong>{{ other_user.username }}</strong>
    </div>

    <div id="chat-log" class="chat-log" style="flex:1; padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;">
        {% for message in messages %}
        <div class="message-wrapper" style="display:flex; flex-direction:column; gap:2px; {% if message.sender == request.user %} align-items:flex-end; {% else %} align-items:flex-start; {% endif %}">
            <div class="message-user" style="display:flex; align-items:center; gap:8px;">
                {% if message.sender.profile.avatar %}
                    <img src="{{ message.sender.profile.avatar.url }}" alt="avatar" style="width:30px; height:30px; border-radius:50%; object-fit:cover;">
                {% else %}
                    <img src="{% static 'default_avatar.png' %}" alt="avatar" style="width:30px; height:30px; border-radius:50%; object-fit:cover;">
                {% endif %}
                <a href="{% url 'user_profile' message.sender.username %}" style="color:white; font-weight:600; text-decoration:none;">
                    {{ message.sender.username }}
                </a>
            </div>
            <div class="message {% if message.sender == request.user %}me{% else %}other{% endif %}"
                 style="max-width:70%; padding:10px 14px; border-radius:14px; font-size:14px; word-wrap:break-word; {% if message.sender == request.user %} background:#2563eb; {% else %} background:#1e293b; {% endif %}">
                {{ message.text }}
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="chat-input" style="display:flex; gap:8px; padding:10px; border-top:1px solid #1e293b;">
        <input id="chat-message-input" placeholder="Написати повідомлення…" style="flex:1; padding:10px 12px; border-radius:20px; border:none; outline:none;">
        <button id="chat-message-submit" style="padding:0 16px; border-radius:20px; border:none; background:#2563eb; color:white; cursor:pointer;">Send</button>
    </div>
</div>

<script>
const chatId = "{{ chat.id }}";
const currentUser = "{{ request.user.username }}";
const currentUserAvatar = "{% if request.user.profile.avatar %}{{ request.user.profile.avatar.url }}{% else %}{% static 'default_avatar.png' %}{% endif %}";

const chatLog = document.getElementById("chat-log");
const input = document.getElementById("chat-message-input");
const sendBtn = document.getElementById("chat-message-submit");

const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
const socket = new WebSocket(protocol + window.location.host + "/ws/chat/" + chatId + "/");

function scrollBottom() {
    chatLog.scrollTop = chatLog.scrollHeight;
}
scrollBottom();

function createMessageElement(username, avatarUrl, text, isCurrentUser) {
    const wrapper = document.createElement("div");
    wrapper.style.display = "flex";
    wrapper.style.flexDirection = "column";
    wrapper.style.gap = "2px";
    wrapper.style.alignItems = isCurrentUser ? "flex-end" : "flex-start";

    const userDiv = document.createElement("div");
    userDiv.style.display = "flex";
    userDiv.style.alignItems = "center";
    userDiv.style.gap = "8px";

    const avatar = document.createElement("img");
    avatar.src = avatarUrl;
    avatar.style.width = "30px";
    avatar.style.height = "30px";
    avatar.style.borderRadius = "50%";
    avatar.style.objectFit = "cover";

    const usernameLink = document.createElement("a");
    usernameLink.href = `/profile/${username}/`;
    usernameLink.textContent = username;
    usernameLink.style.color = "white";
    usernameLink.style.fontWeight = "600";
    usernameLink.style.textDecoration = "none";

    userDiv.appendChild(avatar);
    userDiv.appendChild(usernameLink);

    const msgDiv = document.createElement("div");
    msgDiv.textContent = text;
    msgDiv.style.cssText = `
        max-width:70%;
        padding:10px 14px;
        border-radius:14px;
        font-size:14px;
        word-wrap:break-word;
        background: ${isCurrentUser ? "#2563eb" : "#1e293b"};
    `;

    wrapper.appendChild(userDiv);
    wrapper.appendChild(msgDiv);
    chatLog.appendChild(wrapper);
    scrollBottom();
}

function sendMessage() {
    const msg = input.value.trim();
    if (!msg || socket.readyState !== WebSocket.OPEN) return;

    socket.send(JSON.stringify({ message: msg }));
    createMessageElement(currentUser, currentUserAvatar, msg, true);
    input.value = "";
}

sendBtn.onclick = sendMessage;
input.addEventListener("keydown", e => {
    if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
    }
});

socket.onmessage = function(e) {
    const data = JSON.parse(e.data);
    if (!data.message) return;
    if (data.username === currentUser) return;

    const avatarUrl = data.avatar || "{% static 'default_avatar.png' %}";
    createMessageElement(data.username, avatarUrl, data.message, false);
};
</script>
{% endblock %}
